name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Test · Build (${{ matrix.os }})
    # Windows too: the export writer and the vault paths meet its file
    # locks and separators there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      # The contract must come from a COMMITTED Flutter state (WORKFLOW.md).
      - name: vendor/SOURCE names a committed Flutter commit
        shell: bash
        run: |
          if grep -q "(dirty)" vendor/SOURCE; then
            echo "::error::vendor/ was copied from uncommitted Flutter changes. Commit and push software_hexlore, then run npm run vendor again."
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The build would copy into the dev vault; CI has no reason to.
      - run: npm run build
        env:
          HEXLORE_VAULT: none
